<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f0f4f8"/>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="150" r="80" fill="#e0e7ee" opacity="0.5"/>
  <circle cx="650" cy="450" r="100" fill="#d1dce5" opacity="0.5"/>
  
  <!-- Main content area -->
  <rect x="100" y="100" width="600" height="400" fill="white" rx="20" stroke="#3b82f6" stroke-width="3"/>
  
  <!-- Book/Pages representing education -->
  <g transform="translate(200, 200)">
    <!-- First book -->
    <rect x="0" y="0" width="80" height="100" fill="#3b82f6" rx="5"/>
    <rect x="5" y="5" width="70" height="90" fill="white" rx="3"/>
    <line x1="15" y1="20" x2="65" y2="20" stroke="#3b82f6" stroke-width="2"/>
    <line x1="15" y1="35" x2="65" y2="35" stroke="#3b82f6" stroke-width="2"/>
    <line x1="15" y1="50" x2="55" y2="50" stroke="#3b82f6" stroke-width="2"/>
  </g>
  
  <!-- Second book -->
  <g transform="translate(300, 220)">
    <rect x="0" y="0" width="80" height="100" fill="#6366f1" rx="5"/>
    <rect x="5" y="5" width="70" height="90" fill="white" rx="3"/>
    <line x1="15" y1="20" x2="65" y2="20" stroke="#6366f1" stroke-width="2"/>
    <line x1="15" y1="35" x2="65" y2="35" stroke="#6366f1" stroke-width="2"/>
    <line x1="15" y1="50" x2="55" y2="50" stroke="#6366f1" stroke-width="2"/>
  </g>
  
  <!-- People/Collaboration symbols -->
  <g transform="translate(450, 200)">
    <!-- First person -->
    <circle cx="20" cy="20" r="15" fill="#3b82f6"/>
    <path d="M 5 50 Q 20 35 35 50" fill="#3b82f6"/>
    
    <!-- Second person -->
    <circle cx="60" cy="20" r="15" fill="#6366f1"/>
    <path d="M 45 50 Q 60 35 75 50" fill="#6366f1"/>
    
    <!-- Third person -->
    <circle cx="90" cy="20" r="15" fill="#8b5cf6"/>
    <path d="M 75 50 Q 90 35 105 50" fill="#8b5cf6"/>
  </g>
  
  <!-- Connection lines representing collaboration -->
  <path d="M 470 240 L 490 240" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M 510 240 L 530 240" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  <path d="M 550 240 L 570 240" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Title text -->
  <text x="400" y="460" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#1e293b" text-anchor="middle">Projektskolen</text>
  <text x="400" y="490" font-family="Arial, sans-serif" font-size="20" fill="#64748b" text-anchor="middle">Nota · Samarbejde · Læring</text>
</svg>
